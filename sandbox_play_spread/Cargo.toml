path = "src/table.rs"

[[bin]]
name = "play_vshare"
path = "src/vshare.rs"

[[bin]]
name = "play_upd"
path = "src/upd.rs"

[[bin]]
name = "play_brk"
path = "src/brk.rs"

[[bin]]
name = "play_oct"
path = "src/oct.rs"

[[bin]]
name = "play_upd2"
