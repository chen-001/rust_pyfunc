[package]
name = "align_fold_sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "align_fold"
path = "src/main.rs"

[dependencies]
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
