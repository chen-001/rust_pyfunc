[package]
name = "align_fold_sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "align_fold"
path = "src/main.rs"

[[bin]]
name = "cancel_census"
path = "src/cancel_census.rs"

[[bin]]
name = "bench_kernel"
path = "src/bench_kernel.rs"

[[bin]]
name = "align_fold_v3"
path = "src/align_fold_v3.rs"

[[bin]]
name = "align_fold_v3_slim"
path = "src/align_fold_v3_slim.rs"

[[bin]]
name = "bench_v3"
path = "src/bench_v3.rs"

[dependencies]
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
hdf5 = { package = "hdf5-metno", version = "=0.12.4", features = ["static", "zlib"] }

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
