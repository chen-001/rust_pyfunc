[package]
name = "yupei_refined_sandbox"
version = "0.92.0"
edition = "2021"

[lib]
name = "yupei_refined"
path = "src/lib.rs"

[[bin]]
name = "yupei_refined"
path = "src/main.rs"

[dependencies]
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
sha2 = "0.10"
hdf5 = { package = "hdf5-metno", version = "=0.12.4", features = ["static", "zlib"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
