[package]
name = "yhyb_topcap_sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yhyb_topcap_sandbox"
path = "src/main.rs"

[[bin]]
name = "yhyb_allpool_sandbox"
path = "src/bin_allpool.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
