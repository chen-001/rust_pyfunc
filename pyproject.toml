[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "rust_pyfunc"
long-description = "Python bindings for Rust functions"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dynamic = ["version"]

# 运行时依赖故意留空：这里一旦写上 numpy/pandas/h5py，用 pip install rust_pyfunc 的人
# 漏掉 --no-deps 就会被自动安装或被降级自己环境里的版本。发布前由
# tools/check_wheel_deps.py 检查，安装包只要带 Requires-Dist 就不许上传。

[tool.maturin]
# abi3-py38：pyo3 编译为 stable ABI，每平台只产 1 个 wheel（兼容 Python 3.8+），
# 把每版本 wheel 数从 ~19 砍到 ~6，从源头根治 PyPI 项目 10GB 存储限额问题。
features = ["pyo3/extension-module", "pyo3/abi3-py38"]
python-source = "python"
module-name = "rust_pyfunc"
# worker 二进制随包分发（25MB），同事装完 wheel 就能直接跑多进程 pipeline
include = ["python/rust_pyfunc/*.pyi", "rust_pyfunc/rust_pyfunc_worker"]

[tool.mypy]
mypy_path = "python"
packages = ["rust_pyfunc"]
python_version = "3.9"

