  import-test:
    name: Import Test (Python 3.9)
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Install rust_pyfunc
        run: pip install rust_pyfunc --no-index --find-links dist
      - name: Test import
        run: python -c "import rust_pyfunc; print('import OK')"

  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      new-version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if version changed
        id: check
        run: |
          # 获取当前版本
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"

          # 获取上一次提交的版本
          OLD_VERSION=""
          if git show HEAD~1:Cargo.toml > /tmp/old_cargo.toml 2>/dev/null; then
            OLD_VERSION=$(grep '^version = ' /tmp/old_cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            echo "Previous version: $OLD_VERSION"
          fi

          # 光比提交之间的版本号不够：版本号可能早就写在仓库里（0.90.0 就是），
          # 只是一直没推上来。所以再看一眼 PyPI 上有没有这一版。
          # 查不通时按“没有”处理，上传带 skip-existing，重复上传会被跳过。
          PYPI_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/rust_pyfunc/${CURRENT_VERSION}/json")
          echo "PyPI 上 ${CURRENT_VERSION} 的状态码: $PYPI_STATUS"

          if [ "$CURRENT_VERSION" != "$OLD_VERSION" ] || [ "$PYPI_STATUS" != "200" ]; then
            echo "需要发布 $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "版本号没变且 PyPI 上已经有这一版，跳过发布"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  pypi-publish:
    name: Upload to PyPI
    needs: [windows, linux, macos, sdist, check-version]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.version-changed == 'true'
    environment:
      name: release
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Display version info
        run: |
          echo "Publishing version: ${{ needs.check-version.outputs.new-version }}"
      - name: Check no runtime dependencies
        run: python3 tools/check_wheel_deps.py dist
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist
          verbose: true

