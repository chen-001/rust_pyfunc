  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # python-version: ['3.8', '3.9', '3.10', '3.11']   
        platform:
          - runner: windows-latest
            target: x64
            rustflags: -C target-cpu=x86-64-v3
          - runner: windows-latest
            target: x86
            rustflags: -C target-cpu=pentium4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # python-version: ${{ matrix.python-version }}
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # 覆盖 .cargo/config.toml 的 target-cpu=native（同上：可移植指令集基线）
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # python-version: ['3.8', '3.9', '3.10', '3.11']  
        platform:
          - runner: macos-15
            target: x86_64
            rustflags: -C target-cpu=x86-64-v3
          - runner: macos-14
            target: aarch64
            rustflags: -C target-cpu=generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # python-version: ${{ matrix.python-version }}
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # 覆盖 .cargo/config.toml 的 target-cpu=native（可移植指令集基线）
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

