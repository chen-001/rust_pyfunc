name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        # python-version: ['3.8', '3.9', '3.10', '3.11']
        platform:
          - runner: ubuntu-latest
            target: x86_64
            rustflags: -C target-cpu=x86-64-v3
          - runner: ubuntu-latest
            target: aarch64
            rustflags: -C target-cpu=generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # python-version: ${{ matrix.python-version }}
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # 覆盖 .cargo/config.toml 的 target-cpu=native：wheel 必须用可移植指令集
          # 基线（构建机与 import-test 机 CPU 可能不同；native 会引入 AVX-512 等
          # 专属指令，在低配 runner 上导入时 Illegal instruction 崩溃）
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          # 不能带 --no-default-features：那个参数会关掉 hdf5，而 src 里
          # minute_data_reader / tail_v4_pipeline 等模块无条件用 hdf5_metno，
          # 关掉就编不过（2026-08-29 起 Linux 这一步一直失败）。
          # 静态 HDF5 用 cmake 从源码编，和 Windows、macOS 两个任务一样。
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          before-script-linux: (cmake --version || pip install cmake || python3 -m pip install cmake || (yum install -y cmake3 && ln -sf /usr/bin/cmake3 /usr/local/bin/cmake) || dnf install -y cmake) && cmake --version
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

