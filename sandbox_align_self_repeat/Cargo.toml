[package]
name = "align_self_repeat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "align_self_repeat"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
