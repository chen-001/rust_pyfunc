[package]
name = "align_self_repeat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "align_self_repeat"
path = "src/main.rs"

[[bin]]
name = "align_v3"
path = "src/v3/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
hdf5-metno = { version = "=0.12.4", features = ["static", "zlib"] }
ndarray = "=0.15.6"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
