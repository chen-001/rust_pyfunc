[package]
name = "direct_segments_sandbox"
version = "0.1.0"
edition = "2021"

[lib]
name = "direct_segments_sandbox"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
numpy = "0.18"
ndarray = "0.15"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
libc = "0.2"
chrono = "=0.4.39"
arrow = "51.0"
parquet = "51.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = false
codegen-units = 256
incremental = true
