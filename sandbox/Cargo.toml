[package]
name = "dev_sandbox"
version = "0.1.0"
edition = "2021"

[lib]
name = "dev_sandbox"
crate-type = ["cdylib"]

# ── 依赖：只放当前函数需要的，越少编译越快 ──
# 版本号与主项目 Cargo.toml 保持一致，确保代码迁移后行为相同
[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
numpy = "0.18"
ndarray = "0.15"
rayon = "1.8"

# ── 快速构建配置 ──
# 关闭 LTO，允许多 codegen-unit → 秒级增量编译
# 这里的 [profile.dev] 覆盖默认值，确保即使 maturin develop（默认 dev）也快
[profile.dev]
opt-level = 0
debug = true
codegen-units = 256

# --release 时也保持快速（无 LTO），用于需要优化的正确性验证
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
