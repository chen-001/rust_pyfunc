[package]
name = "relaynet_perf_20261102"
version = "0.1.0"
edition = "2021"

[lib]
name = "relaynet_perf_20261102"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
numpy = "0.18"
ndarray = "0.15"
rayon = "1.8"
once_cell = "1.19"
memmap2 = "0.9"
libc = "0.2"
hdf5-metno = { version = "0.12", features = ["static", "zlib"] }

[profile.release-fast]
inherits = "release"
opt-level = 3
incremental = true
codegen-units = 256
lto = false
