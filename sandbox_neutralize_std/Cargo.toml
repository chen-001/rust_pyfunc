[package]
name = "dev_sandbox_neutralize"
version = "0.1.0"
edition = "2021"

[lib]
name = "dev_sandbox_neutralize"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
numpy = "0.18"
ndarray = "0.15"
nalgebra = "0.32"

[profile.release]
opt-level = 3
codegen-units = 1
